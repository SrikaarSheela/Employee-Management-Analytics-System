
name: Employee Management Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: company_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: test_password
      DB_NAME: company_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Initialize test database
        run: |
          mysql -h 127.0.0.1 -uroot -ptest_password company_db < sql/06_ci_schema.sql
          mysql -h 127.0.0.1 -uroot -ptest_password company_db < sql/02_sample_data.sql

      - name: Generate analytics CSV
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from extract import extract_data; extract_data()"
          python -c "import sys; sys.path.insert(0, 'src'); from transform import transform_employee_data; transform_employee_data()"

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v
